function drawCommit(){let C=D.commits,w=1220,h=240,pad=40,mx=Math.max(...C.map(x=>x.q),1),bw=(w-pad*2)/C.length*0.6;
 let b=C.map((x,i)=>{let x0=pad+i*(w-pad*2)/C.length,bh=(x.q/mx)*(h-pad);
 return `<rect x="${x0}" y="${h-pad-bh}" width="${bw}" height="${bh}" fill="#BF8F00" onmousemove="hov(event,'${x.m} • ${fmt(x.q)} units • ${usd(x.val)}')" onmouseout="out()"></rect>
 <text x="${x0+bw/2}" y="${h-pad+13}" font-size="8" text-anchor="middle" fill="#7387a6">${x.m.slice(2,7)}</text>`}).join('');
 return `<svg viewBox="0 0 ${w} ${h}">${b}</svg><div class="legend">Each bar = products on order for that month's expected delivery (hover for the number).</div>`;}
document.getElementById('p2').innerHTML=`
 <div class="intro"><b>What's coming next.</b> These are products already <b>on order</b> from suppliers but <b>not yet delivered</b>, lined up by the supplier's expected delivery date. This is the forward workload the Denton hub would need to handle.</div>
 <div class="kpis"><div class="kpi"><div class="l">On order (not yet arrived)</div><div class="v">${fmt(D.commit_tot[0])}</div><div class="s">units across open purchase orders</div></div>
 <div class="kpi"><div class="l">Value on order</div><div class="v">${b$(D.commit_tot[1])}</div></div>
 <div class="kpi"><div class="l">Months scheduled out</div><div class="v">${D.commits.length}</div></div></div>
 <h2>Future arrivals by month</h2><div class="card">${drawCommit()}</div>
 <h2>Biggest suppliers on order</h2><div class="card"><table><thead><tr><th class="l">Supplier</th><th>Units on order</th><th>Value $</th></tr></thead><tbody>
 ${D.vtop.map(v=>`<tr><td class="l">${v.v}</td><td>${fmt(v.q)}</td><td>${usd(v.val)}</td></tr>`).join('')}</tbody></table></div>`;
document.getElementById('p3').innerHTML=`

 <b>Scope:</b> ${D.scope}.<br><b>Time window:</b> ${D.window}.<br><b>Pulled:</b> ${D.pulled}.<br><b>Where the data comes from:</b> ${D.source}.</div>

function show(i,b){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('p'+i).classList.add('active');b.classList.add('active');}
